name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install libbpf 1.5.0
        run: |
          # Install libbpf 1.5.0 which includes BPF_MAP_TYPE_ARENA support
          git clone --depth 1 --branch v1.5.0 https://github.com/libbpf/libbpf.git /tmp/libbpf
          cd /tmp/libbpf/src
          # Install to /usr instead of /usr/local for better CGO discovery
          sudo make install PREFIX=/usr
          sudo ldconfig

      - name: Install bpftool
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Verify bpftool installation
        run: |
          which bpftool
          bpftool version

      - name: Build xcover
        run: make xcover

      - name: Verify build artifacts
        run: |
          ls -lh xcover
          file xcover
          ./xcover --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcover-binary
          path: xcover
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install libbpf 1.5.0
        run: |
          # Install libbpf 1.5.0 which includes BPF_MAP_TYPE_ARENA support
          git clone --depth 1 --branch v1.5.0 https://github.com/libbpf/libbpf.git /tmp/libbpf
          cd /tmp/libbpf/src
          # Install to /usr instead of /usr/local for better CGO discovery
          sudo make install PREFIX=/usr
          sudo ldconfig

      - name: Install bpftool
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install libbpf 1.5.0
        run: |
          # Install libbpf 1.5.0 which includes BPF_MAP_TYPE_ARENA support
          git clone --depth 1 --branch v1.5.0 https://github.com/libbpf/libbpf.git /tmp/libbpf
          cd /tmp/libbpf/src
          # Install to /usr instead of /usr/local for better CGO discovery
          sudo make install PREFIX=/usr
          sudo ldconfig

      - name: Install bpftool
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Run go fmt
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Run go vet
        run: |
          # Verify libbpf installation
          pkg-config --modversion libbpf || echo "pkg-config check failed"
          # Run go vet - libbpf 1.5.0 is now in system paths
          go vet ./...

      - name: Run go mod verify
        run: go mod verify
