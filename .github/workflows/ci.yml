name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install bpftool and libbpf
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          # Install libbpf first to get newer headers
          cd /tmp/bpftool/libbpf/src
          sudo make install
          sudo ldconfig
          # Then install bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Verify bpftool installation
        run: |
          which bpftool
          bpftool version

      - name: Build xcover
        run: make xcover

      - name: Verify build artifacts
        run: |
          ls -lh xcover
          file xcover
          ./xcover --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcover-binary
          path: xcover
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install bpftool and libbpf
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          # Install libbpf first to get newer headers
          cd /tmp/bpftool/libbpf/src
          sudo make install
          sudo ldconfig
          # Then install bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Run tests
        run: make test-integration

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install bpftool and libbpf
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          # Install libbpf first to get newer headers
          cd /tmp/bpftool/libbpf/src
          sudo make install
          sudo ldconfig
          # Then install bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Build xcover
        run: make xcover

      - name: Build e2e test binary
        run: go test -c -tags e2e -o /tmp/xcover-e2e.test ./e2e

      - name: Run e2e tests
        run: |
          sudo rm -f /tmp/xcover.sock /tmp/xcover.pid /tmp/xcover.log
          sudo env XCOVER_E2E_BIN="$PWD/xcover" /tmp/xcover-e2e.test -test.v -test.count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install bpftool and libbpf
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          # Install libbpf first to get newer headers
          cd /tmp/bpftool/libbpf/src
          sudo make install
          sudo ldconfig
          # Then install bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Run go fmt
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Run go mod verify
        run: go mod verify
