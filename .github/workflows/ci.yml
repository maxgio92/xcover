name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install bpftool and libbpf
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          # Install libbpf first to get newer headers
          cd /tmp/bpftool/libbpf/src
          sudo make install
          sudo ldconfig
          # Then install bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Verify bpftool installation
        run: |
          which bpftool
          bpftool version

      - name: Build xcover
        run: make xcover

      - name: Verify build artifacts
        run: |
          ls -lh xcover
          file xcover
          ./xcover --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcover-binary
          path: xcover
          retention-days: 7

  submodule-sync:
    name: Verify libbpfgo submodule sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Verify go.mod and submodule reference the same libbpfgo commit
        run: |
          gomod_version=$(grep '^\s*github.com/aquasecurity/libbpfgo ' go.mod | awk '{print $2}')
          submodule_head=$(git -C libbpfgo rev-parse HEAD)

          # Prefer resolving the go.mod version directly as a git ref (tag) in
          # the submodule: libbpfgo tags embed libbpf's own commit hash in
          # their name (e.g. v0.11.0-libbpf-1.8-dev-2bbc483), which is NOT
          # libbpfgo's commit hash, so a tagged version can't be checked by
          # comparing hash substrings.
          git -C libbpfgo fetch --tags --quiet origin
          resolved=$(git -C libbpfgo rev-parse --verify --quiet "${gomod_version}^{commit}" 2>/dev/null) || true

          if [ -n "$resolved" ]; then
            if [ "$resolved" != "$submodule_head" ]; then
              echo "libbpfgo submodule and go.mod are out of sync:"
              echo "  go.mod version '$gomod_version' resolves to commit: $resolved"
              echo "  submodule is checked out at:                       $submodule_head"
              echo "Update go.mod or the submodule pointer so both reference the same commit."
              exit 1
            fi
            echo "libbpfgo submodule and go.mod agree: $gomod_version -> $resolved"
            exit 0
          fi

          # Fall back to Go's pseudo-version convention (trailing 12-hex
          # commit hash) for versions with no matching tag in the submodule.
          gomod_hash=$(echo "$gomod_version" | grep -oE '[0-9a-f]{12}$') || true
          if [ -z "$gomod_hash" ]; then
            echo "go.mod version '$gomod_version' does not resolve to a submodule ref and has no trailing 12-char pseudo-version hash; skipping submodule-sync check."
            exit 0
          fi

          submodule_hash=$(echo "$submodule_head" | cut -c1-12)
          if [ "$gomod_hash" != "$submodule_hash" ]; then
            echo "libbpfgo submodule and go.mod are out of sync:"
            echo "  go.mod pins commit:          $gomod_hash (from $gomod_version)"
            echo "  submodule is checked out at: $submodule_hash"
            echo "Update go.mod (go get github.com/aquasecurity/libbpfgo@<submodule commit>) or the submodule pointer so both reference the same commit."
            exit 1
          fi

          echo "libbpfgo submodule and go.mod agree on commit $gomod_hash"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install bpftool and libbpf
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          # Install libbpf first to get newer headers
          cd /tmp/bpftool/libbpf/src
          sudo make install
          sudo ldconfig
          # Then install bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Run tests
        run: make test-integration

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install bpftool and libbpf
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          # Install libbpf first to get newer headers
          cd /tmp/bpftool/libbpf/src
          sudo make install
          sudo ldconfig
          # Then install bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Build xcover
        run: make xcover

      - name: Build e2e test binary
        run: go test -c -tags e2e -o /tmp/xcover-e2e.test ./e2e

      - name: Run e2e tests
        run: |
          sudo rm -f /tmp/xcover.sock /tmp/xcover.pid /tmp/xcover.log
          sudo env XCOVER_E2E_BIN="$PWD/xcover" /tmp/xcover-e2e.test -test.v -test.count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install bpftool and libbpf
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          # Install libbpf first to get newer headers
          cd /tmp/bpftool/libbpf/src
          sudo make install
          sudo ldconfig
          # Then install bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Run go fmt
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Run go mod verify
        run: go mod verify
