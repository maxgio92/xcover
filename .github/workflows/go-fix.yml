name: go fix

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  gofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            gcc \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      # go fix has to type-check the package, which needs libbpfgo's cgo
      # headers. The system/apt libbpf is too old (e.g. missing
      # BPF_MAP_TYPE_ARENA), so build libbpfgo's own vendored libbpf
      # instead, same as ci.yml's build/test/vet jobs do via `make xcover`
      # and `make test-integration`.
      - name: Build libbpfgo (static)
        run: make libbpfgo-static

      - name: Run go fix
        env:
          CGO_CFLAGS: "-I ${{ github.workspace }}/libbpfgo/output"
          CGO_LDFLAGS: "-lelf -lz ${{ github.workspace }}/libbpfgo/output/libbpf/libbpf.a"
        run: go fix ./...

      - name: Open PR if changes
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8  # v8.1.2
        with:
          commit-message: "chore: go fix"
          branch: bot/go-fix
          title: "chore: go fix"
          body: "Automated `go fix ./...` run."
          delete-branch: true

