name: Release

on:
  push:
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - '.goreleaser.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^URIs: /Architectures: amd64\nURIs: /' /etc/apt/sources.list.d/ubuntu.sources
          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            gcc \
            gcc-aarch64-linux-gnu \
            make \
            pkg-config \
            libelf-dev \
            libelf-dev:arm64 \
            zlib1g-dev \
            zlib1g-dev:arm64

      - name: Install bpftool and libbpf
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          # Install libbpf first to get newer headers
          cd /tmp/bpftool/libbpf/src
          sudo make install
          sudo ldconfig
          # Then install bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Verify bpftool installation
        run: |
          which bpftool
          bpftool version

      - name: Build libbpfgo statically
        run: |
          git submodule init
          git submodule update --recursive
          make -C libbpfgo libbpfgo-static

      - name: Generate vmlinux.h
        run: |
          mkdir -p bpf
          if [ ! -f bpf/vmlinux.h ]; then
            bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          fi

      - name: Build BPF programs for amd64
        run: |
          make xcover/bpf ARCH=x86
        env:
          ARCH: x86

      - name: Configure git to ignore submodule changes
        run: |
          git config diff.ignoreSubmodules dirty
          git submodule foreach --recursive 'git config diff.ignoreSubmodules dirty'

      - name: Run GoReleaser snapshot
        if: github.event_name != 'push'
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PWD: ${{ github.workspace }}

      - name: Run GoReleaser
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PWD: ${{ github.workspace }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
