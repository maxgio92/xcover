name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            gcc \
            gcc-aarch64-linux-gnu \
            make \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install bpftool and libbpf
        run: |
          git clone --depth 1 --branch v7.3.0 --recurse-submodules https://github.com/libbpf/bpftool.git /tmp/bpftool
          # Install libbpf first to get newer headers
          cd /tmp/bpftool/libbpf/src
          sudo make install
          sudo ldconfig
          # Then install bpftool
          cd /tmp/bpftool/src
          make
          sudo make install

      - name: Verify bpftool installation
        run: |
          which bpftool
          bpftool version

      - name: Build libbpfgo statically
        run: |
          git submodule init
          git submodule update --recursive
          make -C libbpfgo libbpfgo-static

      - name: Generate vmlinux.h
        run: |
          mkdir -p bpf
          if [ ! -f bpf/vmlinux.h ]; then
            bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          fi

      - name: Build BPF programs for amd64
        run: |
          make xcover/bpf ARCH=x86
        env:
          ARCH: x86

      - name: Configure git to ignore submodule changes
        run: |
          git config diff.ignoreSubmodules dirty
          git submodule foreach --recursive 'git config diff.ignoreSubmodules dirty'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PWD: ${{ github.workspace }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
