name: Update GitHub Actions

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-actions:
    name: Check for Action Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check for action updates
        id: check-updates
        run: |
          # Function to get the latest commit hash for a tag
          get_latest_hash() {
            local repo=$1
            local tag=$2
            gh api "repos/${repo}/git/refs/tags/${tag}" --jq '.object.sha' 2>/dev/null || echo ""
          }

          # Function to extract current hash from workflow file
          get_current_hash() {
            local action=$1
            local file=$2
            grep -o "${action}@[a-f0-9]\{40\}" "$file" | head -1 | cut -d@ -f2 || echo ""
          }

          UPDATES_FOUND=false
          UPDATE_SUMMARY=""

          # Check actions/checkout@v4
          CURRENT=$(get_current_hash "actions/checkout" ".github/workflows/ci.yml")
          LATEST=$(get_latest_hash "actions/checkout" "v4")
          if [ -n "$LATEST" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "Update available: actions/checkout v4"
            echo "  Current: $CURRENT"
            echo "  Latest:  $LATEST"
            UPDATES_FOUND=true
            UPDATE_SUMMARY="${UPDATE_SUMMARY}- actions/checkout@v4: \`${CURRENT:0:7}\` → \`${LATEST:0:7}\`\n"
          fi

          # Check actions/setup-go@v5
          CURRENT=$(get_current_hash "actions/setup-go" ".github/workflows/ci.yml")
          LATEST=$(get_latest_hash "actions/setup-go" "v5")
          if [ -n "$LATEST" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "Update available: actions/setup-go v5"
            echo "  Current: $CURRENT"
            echo "  Latest:  $LATEST"
            UPDATES_FOUND=true
            UPDATE_SUMMARY="${UPDATE_SUMMARY}- actions/setup-go@v5: \`${CURRENT:0:7}\` → \`${LATEST:0:7}\`\n"
          fi

          # Check actions/upload-artifact@v4
          CURRENT=$(get_current_hash "actions/upload-artifact" ".github/workflows/ci.yml")
          LATEST=$(get_latest_hash "actions/upload-artifact" "v4")
          if [ -n "$LATEST" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "Update available: actions/upload-artifact v4"
            echo "  Current: $CURRENT"
            echo "  Latest:  $LATEST"
            UPDATES_FOUND=true
            UPDATE_SUMMARY="${UPDATE_SUMMARY}- actions/upload-artifact@v4: \`${CURRENT:0:7}\` → \`${LATEST:0:7}\`\n"
          fi

          # Check goreleaser/goreleaser-action@v6
          CURRENT=$(get_current_hash "goreleaser/goreleaser-action" ".github/workflows/release.yml")
          LATEST=$(get_latest_hash "goreleaser/goreleaser-action" "v6")
          if [ -n "$LATEST" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "Update available: goreleaser/goreleaser-action v6"
            echo "  Current: $CURRENT"
            echo "  Latest:  $LATEST"
            UPDATES_FOUND=true
            UPDATE_SUMMARY="${UPDATE_SUMMARY}- goreleaser/goreleaser-action@v6: \`${CURRENT:0:7}\` → \`${LATEST:0:7}\`\n"
          fi

          echo "updates_found=$UPDATES_FOUND" >> $GITHUB_OUTPUT
          echo "update_summary<<EOF" >> $GITHUB_OUTPUT
          echo -e "$UPDATE_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update action hashes
        if: steps.check-updates.outputs.updates_found == 'true'
        run: |
          # Function to get the latest commit hash for a tag
          get_latest_hash() {
            local repo=$1
            local tag=$2
            gh api "repos/${repo}/git/refs/tags/${tag}" --jq '.object.sha' 2>/dev/null || echo ""
          }

          # Function to update action hash in file
          update_action() {
            local file=$1
            local action=$2
            local version=$3
            local current_hash=$4
            local new_hash=$5

            if [ -n "$new_hash" ] && [ "$current_hash" != "$new_hash" ]; then
              sed -i "s|${action}@${current_hash}|${action}@${new_hash}|g" "$file"
              echo "Updated ${action}@${version} in $file"
            fi
          }

          # Update actions/checkout@v4
          for file in .github/workflows/*.yml; do
            CURRENT=$(grep -o "actions/checkout@[a-f0-9]\{40\}" "$file" | head -1 | cut -d@ -f2 || echo "")
            LATEST=$(get_latest_hash "actions/checkout" "v4")
            update_action "$file" "actions/checkout" "v4" "$CURRENT" "$LATEST"
          done

          # Update actions/setup-go@v5
          for file in .github/workflows/*.yml; do
            CURRENT=$(grep -o "actions/setup-go@[a-f0-9]\{40\}" "$file" | head -1 | cut -d@ -f2 || echo "")
            LATEST=$(get_latest_hash "actions/setup-go" "v5")
            update_action "$file" "actions/setup-go" "v5" "$CURRENT" "$LATEST"
          done

          # Update actions/upload-artifact@v4
          for file in .github/workflows/*.yml; do
            CURRENT=$(grep -o "actions/upload-artifact@[a-f0-9]\{40\}" "$file" | head -1 | cut -d@ -f2 || echo "")
            LATEST=$(get_latest_hash "actions/upload-artifact" "v4")
            update_action "$file" "actions/upload-artifact" "v4" "$CURRENT" "$LATEST"
          done

          # Update goreleaser/goreleaser-action@v6
          for file in .github/workflows/*.yml; do
            CURRENT=$(grep -o "goreleaser/goreleaser-action@[a-f0-9]\{40\}" "$file" | head -1 | cut -d@ -f2 || echo "")
            LATEST=$(get_latest_hash "goreleaser/goreleaser-action" "v6")
            update_action "$file" "goreleaser/goreleaser-action" "v6" "$CURRENT" "$LATEST"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: steps.check-updates.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            ci: update pinned GitHub Actions to latest versions

            ${{ steps.check-updates.outputs.update_summary }}
          branch: chore/update-actions
          delete-branch: true
          title: 'ci: update pinned GitHub Actions'
          body: |
            ## GitHub Actions Updates

            This automated PR updates pinned GitHub Actions to their latest versions.

            ### Changes

            ${{ steps.check-updates.outputs.update_summary }}

            ### Security Note

            All actions remain pinned to commit hashes for security. The version comments are preserved for readability.

            ---
            🤖 Generated by automated action update workflow
          labels: |
            dependencies
            automation
